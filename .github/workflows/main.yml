name: SQL Autograding

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  autograde:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: CollegeDB
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Wait for MySQL
        run: |
          until mysqladmin ping -h127.0.0.1 -uroot -proot --silent
          do
            sleep 2
          done

      - name: Run student SQL
        run: |
          mysql -h127.0.0.1 -uroot -proot < starter.sql

      - name: Run test cases
        run: |
          mysql -h127.0.0.1 -uroot -proot < testcase.sql
